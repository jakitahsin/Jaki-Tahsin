<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project — Jaki Tahsin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="/seed.js"></script>
<style>
:root{--bg:#07090E;--bg2:#0C1220;--s:#111A2A;--tx:#F4F7FC;--t2:#A7B3C8;--ice:#C8E4FF;--cy:#19D7E8;--bd:#273448}*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 15% -5%,#10285f55,transparent),var(--bg);color:var(--tx);font:15px/1.8 Poppins,system-ui,sans-serif}a{color:inherit;text-decoration:none}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 8vw;border-bottom:1px solid var(--bd)}nav b{letter-spacing:.2em;font-size:14px}nav a:not(b){color:var(--t2);font-size:13px}nav a:hover{color:var(--cy)}
main{max-width:1100px;margin:auto;padding:60px 8vw 40px}.eye{color:var(--cy);font-size:11px;letter-spacing:.28em;text-transform:uppercase}
h1{font-size:clamp(32px,5vw,62px);line-height:1.1;font-weight:800;margin:12px 0 18px;background:linear-gradient(180deg,#fff,#8fa6c4);-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);margin:34px 0}.meta div{background:var(--bg);padding:16px 18px}.meta small{display:block;color:var(--cy);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.hero-img{width:100%;border-radius:8px;border:1px solid var(--bd);display:block;box-shadow:0 0 70px rgba(25,215,232,.12)}.gal img{margin-top:22px}
h2{font-size:22px;margin:46px 0 8px}p.t{color:var(--t2);max-width:720px;white-space:pre-line}ul.d{list-style:none;display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}ul.d li{border:1px solid var(--bd);background:var(--bg2);padding:8px 16px;border-radius:999px;font-size:13px}
.pn{display:flex;justify-content:space-between;gap:16px;margin:60px 0 20px;border-top:1px solid var(--bd);padding-top:26px}.pn a{color:var(--t2)}.pn a:hover{color:var(--cy)}.pn small{display:block;font-size:11px;letter-spacing:.2em;color:var(--cy)}
.cta{text-align:center;padding:60px 8vw 80px}.cta a{display:inline-block;margin-top:14px;padding:13px 28px;border-radius:999px;background:var(--cy);color:#04121a;font-weight:600;transition:.25s}.cta a:hover{box-shadow:0 0 30px rgba(25,215,232,.4);transform:scale(1.06)}
footer{text-align:center;padding:30px;color:var(--t2);font-size:13px;border-top:1px solid var(--bd)}:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
</style></head><body>
<nav><a href="/"><b>JAKI TAHSIN</b></a><a href="/#works">← Back to works</a></nav><main id="m"><p class="eye">Loading…</p></main><div class="cta"><h2 style="margin:0">Have a project in mind?</h2><a href="/#contact">Let's work together</a></div><footer>© <span id="y"></span> Jaki Tahsin · <a href="mailto:jakitahsin@gmail.com">jakitahsin@gmail.com</a></footer>
<script>
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('y').textContent=new Date().getFullYear();
const sl=w=>w.slug||String(w.title).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
(async()=>{let d=null;try{const r=await fetch('/api/data?k=public');if(r.ok)d=await r.json()}catch{}
const L=((d&&d.works)||SEED_WORKS).filter(w=>w.published!==false),s=decodeURIComponent(location.pathname.split('/work/')[1]||new URLSearchParams(location.search).get('s')||'').replace(/\/$/,''),i=L.findIndex(w=>sl(w)===s),m=document.getElementById('m');
if(i<0){m.innerHTML='<h1>Project not found</h1><p class="t"><a href="/#works" style="color:var(--cy)">← See all works</a></p>';return}
const w=L[i],P=L[(i-1+L.length)%L.length],N=L[(i+1)%L.length],imgs=[w.cover,...(w.gallery||[])].filter(Boolean),dl=Array.isArray(w.deliverables)?w.deliverables:String(w.deliverables||'').split('\n').filter(Boolean);
document.title=w.title+' — Jaki Tahsin';
const meta=[['Client',w.client],['Year',w.year],['My role',w.role],['Services',w.services||(w.cats||[]).join(', ')]].filter(x=>x[1]);
const sec=(h,t)=>t?`<h2>${h}</h2><p class="t">${e(t)}</p>`:'';
m.innerHTML=`<p class="eye">${e((w.cats||[]).join(' · '))}</p><h1>${e(w.title)}</h1><p class="t">${e(w.desc)}</p><div class="meta">${meta.map(x=>`<div><small>${x[0]}</small>${e(x[1])}</div>`).join('')}</div>
${imgs.length?`<img class="hero-img" src="${e(imgs[0])}" alt="${e(w.title)}">`:''}${sec('Creative challenge',w.challenge)}${sec('Design approach',w.approach)}${dl.length?`<h2>Deliverables</h2><ul class="d">${dl.map(x=>`<li>${e(x)}</li>`).join('')}</ul>`:''}<div class="gal">${imgs.slice(1).map(u=>`<img class="hero-img" loading="lazy" src="${e(u)}" alt="${e(w.title)}">`).join('')}</div>
<div class="pn"><a href="/work/${e(sl(P))}"><small>← PREVIOUS</small>${e(P.title)}</a><a href="/work/${e(sl(N))}" style="text-align:right"><small>NEXT →</small>${e(N.title)}</a></div>`})();
</script></body></html>
