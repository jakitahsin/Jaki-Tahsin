<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin — Jaki Tahsin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><script src="/seed.js"></script>
<style>
:root{--bg:#07090E;--s:#111A2A;--s2:#0C1220;--tx:#F4F7FC;--t2:#A7B3C8;--cy:#19D7E8;--bd:#273448}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Poppins,system-ui,sans-serif}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:9px 11px;width:100%}
button{width:auto;cursor:pointer;background:var(--s)}button:hover{border-color:var(--cy)}button.p{background:var(--cy);color:#04121a;font-weight:600;border-color:var(--cy)}button.d{color:#ff8a98}
label{display:block;font-size:12px;color:var(--t2);margin:10px 0 4px}input[type=checkbox]{width:auto;margin-right:6px}.ck{display:inline-flex;align-items:center;margin:4px 12px 4px 0;font-size:13px;color:var(--tx)}
header{display:flex;gap:8px;align-items:center;padding:14px 4vw;border-bottom:1px solid var(--bd);flex-wrap:wrap}header b{letter-spacing:.2em;margin-right:auto}
header button.a{border-color:var(--cy);color:var(--cy)}main{padding:24px 4vw;max-width:1400px;margin:auto}
.box{background:var(--s);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:18px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.row img{width:64px;height:44px;object-fit:cover;border-radius:4px;background:#fff}.row div.i{flex:1;min-width:0}.row small{color:var(--t2)}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.th span{position:relative}.th img{height:64px;border-radius:4px}.th i{position:absolute;top:-6px;right:-6px;background:#7a1f2b;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;cursor:pointer;font-style:normal}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;opacity:0;transition:.3s;z-index:9}
.login{max-width:340px;margin:20vh auto;text-align:center}.hide{display:none!important}
.inv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.it{display:grid;grid-template-columns:1fr 90px 60px 90px 30px;gap:6px;align-items:center;margin-bottom:6px}
#doc{background:#fff;color:#0b1b33;padding:36px;font-size:12px;box-shadow:0 0 40px #0008;min-height:600px}#doc h1{font-size:30px;color:#0b1b33;letter-spacing:.08em}#doc .ac{color:#0aa9bd}
#doc table{width:100%;border-collapse:collapse;margin:18px 0}#doc th{background:#0b1b33;color:#fff;text-align:left;padding:7px}#doc td{padding:7px;border-bottom:1px solid #dde5ee}#doc .r{text-align:right}
#doc .tt{margin-left:auto;width:55%}#doc .tt div{display:flex;justify-content:space-between;padding:4px 0}#doc .tt .b{font-weight:700;font-size:14px;border-top:2px solid #0b1b33;margin-top:4px;padding-top:8px}
#doc .hd{display:flex;justify-content:space-between;gap:20px}#doc .cols{display:flex;gap:30px;margin-top:22px}#doc .cols>div{flex:1}#doc h4{color:#0aa9bd;font-size:10px;letter-spacing:.15em;margin-bottom:4px}
@page{size:A4;margin:12mm}@media print{.np{display:none!important}body{background:#fff}main{padding:0;max-width:none}.inv{display:block}#doc{box-shadow:none;padding:0}}
@media(max-width:900px){.inv,.g2{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login hide"><h2>ADMIN</h2><p style="color:#A7B3C8;margin:8px 0 18px">Jaki Tahsin portfolio</p><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><br><br><button class="p" style="width:100%" onclick="login()">Log in</button><p id="le" style="color:#ff8a98;margin-top:12px"></p></div>
<div id="app" class="hide"><header class="np"><b>JT ADMIN</b><button data-t="works" onclick="tab('works')">Works</button><button data-t="clients" onclick="tab('clients')">Clients</button><button data-t="inv" onclick="tab('inv')">Invoices</button><a href="/" target="_blank" style="color:#A7B3C8;margin:0 8px">View site ↗</a><button onclick="logout()">Logout</button></header><main id="m"></main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Brand Identity','Social Media','Print Design','Event Branding','Posters & Campaigns','Presentation & Pitch Decks','Digital Design','AI-Assisted Work'];
let D={works:[],clients:[]},INV={invoices:[],profile:{}},cur=null,inv=null,T='works';
const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j&&j.error||r.status);return j};
const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.style.background=bad?'#7a1f2b':'#0e5560';t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2400)};
const sv=(k,o)=>api('/api/data?k='+k,{method:'POST',body:JSON.stringify(o)}).then(()=>{toast(k==='public'?'Saved — live on your site':'Saved');return true}).catch(e=>{toast(e.message,1);return false});
const uid=()=>Math.random().toString(36).slice(2,10);
async function login(){try{await api('/api/auth',{method:'POST',body:JSON.stringify({password:$('#pw').value})});boot()}catch(e){$('#le').textContent=e.message}}
$('#pw').onkeydown=e=>e.key==='Enter'&&login();
async function logout(){await api('/api/auth',{method:'DELETE'});location.reload()}
async function boot(){const a=await api('/api/auth');if(!a.admin){$('#login').classList.remove('hide');return}$('#login').classList.add('hide');$('#app').classList.remove('hide');
 try{const d=await api('/api/data?k=public');D=d&&d.works?d:{works:SEED_WORKS.map(w=>({...w})),clients:SEED_CLIENTS.map(c=>({...c}))};
 const i=await api('/api/data?k=inv');INV=i&&i.invoices?i:{invoices:[],profile:{from:{name:'Jaki Tahsin',email:'jakitahsin@gmail.com'},pay:{},currency:'BDT'}}}catch(e){toast(e.message,1)}tab('works')}
function tab(t){T=t;cur=null;inv=null;document.querySelectorAll('header [data-t]').forEach(b=>b.classList.toggle('a',b.dataset.t===t));({works:rW,clients:rC,inv:rI})[t]()}
async function up(file,max){const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 return (await api('/api/upload',{method:'POST',body:JSON.stringify({dataUrl:c.toDataURL('image/webp',.86),name:file.name})})).url}
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};
/* WORKS */
function rW(){const m=$('#m');if(cur){const w=cur;m.innerHTML=`<div class="box"><h3>${D.works.includes(w)?'Edit':'New'} work</h3><div class="g2"><div><label>Title</label><input value="${esc(w.title)}" oninput="cur.title=this.value"><label>Client / organization</label><input value="${esc(w.client)}" oninput="cur.client=this.value"><label>Year / period</label><input value="${esc(w.year)}" oninput="cur.year=this.value"><label>My role</label><input value="${esc(w.role)}" oninput="cur.role=this.value"><label>Services</label><input value="${esc(w.services)}" oninput="cur.services=this.value"><label>URL slug (optional)</label><input value="${esc(w.slug)}" placeholder="auto from title" oninput="cur.slug=this.value"></div><div><label>Overview</label><textarea rows="4" oninput="cur.desc=this.value">${esc(w.desc)}</textarea><label>Creative challenge (optional)</label><textarea rows="3" oninput="cur.challenge=this.value">${esc(w.challenge)}</textarea><label>Design approach (optional)</label><textarea rows="3" oninput="cur.approach=this.value">${esc(w.approach)}</textarea><label>Deliverables (one per line)</label><textarea rows="3" oninput="cur.deliverables=this.value.split('\n').filter(Boolean)">${esc((w.deliverables||[]).join('\n'))}</textarea></div></div>
<label>Categories</label>${CATS.map(c=>`<label class="ck"><input type="checkbox" ${(w.cats||[]).includes(c)?'checked':''} onchange="tc('${c.replace("'","\\'")}',this.checked)">${esc(c)}</label>`).join('')}
<div class="g2"><div><label>Cover image</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="upc(this,'cover')">${w.cover?`<div class="th"><span><img src="${esc(w.cover)}"></span></div>`:''}</div><div><label>Gallery images (multiple)</label><input type="file" multiple accept="image/png,image/jpeg,image/webp" onchange="upc(this,'gallery')"><div class="th">${(w.gallery||[]).map((u,i)=>`<span><img src="${esc(u)}"><i onclick="cur.gallery.splice(${i},1);rW()">×</i></span>`).join('')}</div></div></div>
<label class="ck"><input type="checkbox" ${w.featured?'checked':''} onchange="cur.featured=this.checked">Featured (large card)</label><label class="ck"><input type="checkbox" ${w.published!==false?'checked':''} onchange="cur.published=this.checked">Published</label><br><br><button class="p" onclick="saveW()">Save & publish</button> <button onclick="tab('works')">Cancel</button></div>`;return}
 m.innerHTML=`<div class="box"><button class="p" onclick="cur={id:uid(),title:'',client:'',year:'',role:'Graphic Designer',services:'',slug:'',challenge:'',approach:'',deliverables:[],cats:[],desc:'',cover:'',gallery:[],featured:false,published:true};rW()">+ Add new work</button><div style="margin-top:12px">${D.works.map((w,i)=>`<div class="row"><img src="${esc(w.cover)}" alt=""><div class="i"><b>${esc(w.title)}</b> ${w.published===false?'<small>(draft)</small>':''}<br><small>${esc((w.cats||[]).join(', '))} ${esc(w.year)}</small></div><button onclick="mv(D.works,${i},-1);sv('public',D);rW()">↑</button><button onclick="mv(D.works,${i},1);sv('public',D);rW()">↓</button><button onclick="cur=D.works[${i}];rW()">Edit</button><button class="d" onclick="if(confirm('Delete this work?')){D.works.splice(${i},1);sv('public',D);rW()}">Delete</button></div>`).join('')||'<p>No works yet.</p>'}</div></div>`}
function tc(c,on){cur.cats=cur.cats||[];cur.cats=on?[...new Set([...cur.cats,c])]:cur.cats.filter(x=>x!==c)}
async function upc(el,k){try{toast('Uploading…');for(const f of el.files){const u=await up(f,1800);if(k==='cover')cur.cover=u;else(cur.gallery=cur.gallery||[]).push(u)}rW();toast('Uploaded')}catch(e){toast(e.message,1)}}
async function saveW(){if(!cur.title.trim())return toast('Title required',1);cur.slug=(cur.slug||cur.title).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(D.works.some(x=>x!==cur&&x.slug===cur.slug))return toast('Slug already used',1);if(!D.works.includes(cur))D.works.unshift(cur);if(await sv('public',D))tab('works')}
/* CLIENTS */
function rC(){const m=$('#m');if(cur){m.innerHTML=`<div class="box"><h3>Client</h3><div class="g2"><div><label>Name</label><input value="${esc(cur.name)}" oninput="cur.name=this.value"><label>Website (optional)</label><input value="${esc(cur.url)}" oninput="cur.url=this.value"></div><div><label>Logo (PNG/WebP/JPG, transparent PNG is best)</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="upl(this)">${cur.logo?`<div class="th"><span><img src="${esc(cur.logo)}" style="background:#fff;padding:6px"></span></div>`:''}</div></div><label class="ck"><input type="checkbox" ${cur.visible!==false?'checked':''} onchange="cur.visible=this.checked">Show on website</label><br><br><button class="p" onclick="saveC()">Save</button> <button onclick="tab('clients')">Cancel</button></div>`;return}
 m.innerHTML=`<div class="box"><button class="p" onclick="cur={id:uid(),name:'',logo:'',url:'',visible:true};rC()">+ Add client</button><div style="margin-top:12px">${D.clients.map((c,i)=>`<div class="row"><img src="${esc(c.logo)}" alt=""><div class="i"><b>${esc(c.name)}</b> ${c.visible===false?'<small>(hidden)</small>':''}</div><button onclick="mv(D.clients,${i},-1);sv('public',D);rC()">↑</button><button onclick="mv(D.clients,${i},1);sv('public',D);rC()">↓</button><button onclick="cur=D.clients[${i}];rC()">Edit</button><button class="d" onclick="if(confirm('Delete?')){D.clients.splice(${i},1);sv('public',D);rC()}">Delete</button></div>`).join('')}</div></div>`}
async function upl(el){try{toast('Uploading…');cur.logo=await up(el.files[0],800);rC()}catch(e){toast(e.message,1)}}
async function saveC(){if(!cur.name.trim())return toast('Name required',1);if(!D.clients.includes(cur))D.clients.push(cur);if(await sv('public',D))tab('clients')}
/* INVOICES */
const cents=v=>Math.round((parseFloat(v)||0)*100),today=()=>new Date().toISOString().slice(0,10);
const fm=(c,cu)=>new Intl.NumberFormat('en-BD',{style:'currency',currency:cu||'BDT'}).format(c/100);
function calc(o){let sub=0;o.items.forEach(i=>{i.t=Math.round(cents(i.p)*(parseFloat(i.q)||0));sub+=i.t});const disc=Math.min(cents(o.disc),sub),tax=Math.round((sub-disc)*(parseFloat(o.taxRate)||0)/100),total=sub-disc+tax;return{sub,disc,tax,total,due:total-cents(o.paid)}}
const stat=o=>{const c=calc(o);return c.total>0&&c.due<=0?'Paid':o.due&&o.due<today()?'Overdue':cents(o.paid)>0?'Partial':'Unpaid'};
function nextNo(){const y=new Date().getFullYear(),n=INV.invoices.filter(i=>i.no.startsWith('JT-INV-'+y)).map(i=>parseInt(i.no.split('-').pop())||0);return`JT-INV-${y}-${String((n.length?Math.max(...n):0)+1).padStart(3,'0')}`}
function newInv(){const p=INV.profile;return{id:uid(),no:nextNo(),date:today(),due:'',currency:p.currency||'BDT',to:{name:'',phone:'',address:''},from:{name:'Jaki Tahsin',phone:'',address:'',email:'jakitahsin@gmail.com',...(p.from||{})},items:[{d:'',p:'',q:1}],disc:'',taxRate:'',paid:'',pay:{...(p.pay||{})},notes:'Thank you for your trust and collaboration.'}}
function rI(){const m=$('#m');if(!inv){m.innerHTML=`<div class="box"><button class="p" onclick="inv=newInv();rI()">+ New invoice</button><table style="width:100%;margin-top:14px;border-collapse:collapse"><tr style="color:#A7B3C8;text-align:left"><th>No.</th><th>Client</th><th>Total</th><th>Due</th><th>Status</th><th></th></tr>${INV.invoices.map((o,i)=>{const c=calc(o);return`<tr style="border-top:1px solid #273448"><td>${esc(o.no)}</td><td>${esc(o.to.name)}</td><td>${fm(c.total,o.currency)}</td><td>${fm(c.due,o.currency)}</td><td>${stat(o)}</td><td style="text-align:right;white-space:nowrap"><button onclick="inv=JSON.parse(JSON.stringify(INV.invoices[${i}]));rI()">Open</button> <button onclick="dupI(${i})">Duplicate</button> <button class="d" onclick="if(confirm('Delete invoice?')){INV.invoices.splice(${i},1);sv('inv',INV);rI()}">Delete</button></td></tr>`}).join('')}</table></div>`;return}
 const f=(p,l,t='text')=>`<label>${l}</label><input type="${t}" ${t==='number'?'step="any" min="0"':''} data-p="${p}" value="${esc(p.split('.').reduce((a,k)=>a&&a[k],inv))}" oninput="sp(this)">`;
 m.innerHTML=`<div class="inv"><div class="np"><div class="box"><div class="g2"><div>${f('no','Invoice number')}</div><div>${f('date','Date','date')}</div><div>${f('due','Due date','date')}</div><div><label>Currency</label><select data-p="currency" onchange="sp(this)">${['BDT','USD','EUR','GBP'].map(c=>`<option ${inv.currency===c?'selected':''}>${c}</option>`).join('')}</select></div></div></div>
<div class="box g2"><div><h4>Bill to</h4>${f('to.name','Name')}${f('to.phone','Phone')}${f('to.address','Address')}</div><div><h4>Bill from</h4>${f('from.name','Name')}${f('from.phone','Phone')}${f('from.address','Address')}</div></div>
<div class="box"><h4>Items</h4><div id="its"></div><button onclick="inv.items.push({d:'',p:'',q:1});ri()">+ Add item</button><div class="g2">${f('disc','Discount (amount)','number')}${f('taxRate','Tax (%)','number')}${f('paid','Amount paid','number')}</div></div>
<div class="box"><h4>Payment details</h4><div class="g2">${f('pay.bank','Bank name')}${f('pay.acName','Account holder')}${f('pay.acNo','Bank account number')}${f('pay.branch','Branch')}${f('pay.mfs','Mobile banking (bKash / Nagad / Rocket)')}${f('pay.mfsNo','Mobile banking number')}</div>${f('notes','Notes')}</div>
<button class="p" onclick="saveI()">Save invoice</button> <button onclick="window.print()">Print / Save as PDF</button> <button onclick="tab('inv')">Back</button></div><div><div id="doc"></div></div></div>`;ri()}
function ri(){$('#its').innerHTML=inv.items.map((it,i)=>`<div class="it"><input placeholder="${i+1}. Description" value="${esc(it.d)}" oninput="inv.items[${i}].d=this.value;pv()"><input type="number" step="any" min="0" placeholder="Price" value="${esc(it.p)}" oninput="inv.items[${i}].p=this.value;pv()"><input type="number" step="any" min="0" placeholder="Qty" value="${esc(it.q)}" oninput="inv.items[${i}].q=this.value;pv()"><b id="lt${i}" style="font-size:12px"></b><button class="d" onclick="inv.items.splice(${i},1);ri()">×</button></div>`).join('');pv()}
function sp(el){const k=el.dataset.p.split('.');let o=inv;while(k.length>1)o=o[k.shift()];o[k[0]]=el.value;pv()}
function pv(){const c=calc(inv),F=v=>fm(v,inv.currency);inv.items.forEach((it,i)=>{const e=$('#lt'+i);if(e)e.textContent=F(it.t)});const p=inv.pay,pl=[['Bank',p.bank],['Account holder',p.acName],['Account no.',p.acNo],['Branch',p.branch],['Mobile banking',p.mfs],['Mobile number',p.mfsNo]].filter(x=>x[1]);
 $('#doc').innerHTML=`<div class="hd"><div><h1>INVOICE</h1><div class="ac"><b>${esc(inv.no)}</b></div></div><div class="r"><b style="font-size:15px">${esc(inv.from.name)}</b><br>Graphic Designer<br>${esc(inv.from.email||'')}</div></div><div class="cols"><div><h4>BILL TO</h4><b>${esc(inv.to.name)}</b><br>${esc(inv.to.phone)}<br>${esc(inv.to.address)}</div><div><h4>BILL FROM</h4><b>${esc(inv.from.name)}</b><br>${esc(inv.from.phone)}<br>${esc(inv.from.address)}</div><div class="r"><h4>DATE</h4>${esc(inv.date)}<br><h4 style="margin-top:8px">DUE DATE</h4>${esc(inv.due||'—')}</div></div>
<table><thead><tr><th>No.</th><th>Description</th><th class="r">Price</th><th class="r">Qty</th><th class="r">Total</th></tr></thead><tbody>${inv.items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.d)}</td><td class="r">${F(cents(it.p))}</td><td class="r">${esc(it.q)}</td><td class="r">${F(it.t)}</td></tr>`).join('')}</tbody></table>
<div class="tt"><div><span>Subtotal</span><span>${F(c.sub)}</span></div>${c.disc?`<div><span>Discount</span><span>− ${F(c.disc)}</span></div>`:''}${c.tax?`<div><span>Tax (${esc(inv.taxRate)}%)</span><span>${F(c.tax)}</span></div>`:''}<div class="b"><span>Total</span><span>${F(c.total)}</span></div>${cents(inv.paid)?`<div><span>Paid</span><span>${F(cents(inv.paid))}</span></div>`:''}<div class="b ac"><span>Due</span><span>${F(c.due)}</span></div></div>
${pl.length?`<h4 style="margin-top:26px">PAYMENT DETAILS</h4>${pl.map(x=>`<div>${x[0]}: <b>${esc(x[1])}</b></div>`).join('')}`:''}${inv.notes?`<p style="margin-top:22px;color:#51627a">${esc(inv.notes)}</p>`:''}`}
async function saveI(){if(!inv.no.trim())return toast('Invoice number required',1);if(INV.invoices.some(o=>o.no===inv.no&&o.id!==inv.id))return toast('Invoice number already exists',1);
 const i=INV.invoices.findIndex(o=>o.id===inv.id);i<0?INV.invoices.unshift(inv):INV.invoices[i]=inv;INV.profile={from:inv.from,pay:inv.pay,currency:inv.currency};await sv('inv',INV)}
function dupI(i){inv=JSON.parse(JSON.stringify(INV.invoices[i]));inv.id=uid();inv.no=nextNo();inv.date=today();inv.paid='';rI()}
boot();
</script></body></html>
